[package]
name = "rust-embed-for-web"
version = "11.4.1"
description = "Rust Macro which embeds files into your executable. A fork of `rust-embed` with a focus on usage on web servers."
readme = "README.md"
documentation = "https://docs.rs/rust-embed-for-web"
repository = "https://github.com/SeriousBug/rust-embed-for-web"
license = "MIT"
keywords = ["http", "embed", "static", "web", "server"]
categories = ["web-programming", "filesystem"]
edition = "2018"

[dependencies]
walkdir = "2.4.0"
rust-embed-for-web-impl = { version = "11.4.1", path = "impl" }
rust-embed-for-web-utils = { version = "11.4.1", path = "utils" }

[dev-dependencies]
chrono = { version = "0.4", default-features = false }
flate2 = "1.0"
brotli = "8.0"
zstd = "0.13"
actix-web = "4.4"
criterion = "0.7"
# Pin below 0.3.52: it changed the Parsable::parse signature, which breaks
# cookie 0.16.2 (pulled in transitively by actix-web). Dev-only constraint.
time = ">=0.3, <0.3.52"

[features]
default = ["interpolate-folder-path", "include-exclude"]
# Even in debug mode use a release embed.
# We use this to test embed code in our tests.
always-embed = ["rust-embed-for-web-impl/always-embed"]
# Allow environment variables and ~'s to be expanded
interpolate-folder-path = ["rust-embed-for-web-impl/interpolate-folder-path"]
include-exclude = [
  "rust-embed-for-web-impl/include-exclude",
  "rust-embed-for-web-utils/include-exclude",
]
compression-zstd = ["rust-embed-for-web-impl/compression-zstd", "rust-embed-for-web-utils/compression-zstd"]
# Generate a large fixture folder (via build.rs) for benchmarks. Off by
# default so normal and published builds are unaffected. Implies always-embed
# so the embedded (release) code path is exercised even in debug builds.
bench-fixtures = ["always-embed"]

[workspace]
members = ["impl", "utils"]

[[test]]
name = "compression"
path = "tests/compression.rs"
required-features = ["always-embed", "compression-zstd"]

[[test]]
name = "compression_without_zstd"
path = "tests/compression_without_zstd.rs"
required-features = ["always-embed"]

[[test]]
name = "gzip"
path = "tests/gzip.rs"
required-features = ["always-embed"]

[[test]]
name = "zstd"
path = "tests/zstd.rs"
required-features = ["always-embed", "compression-zstd"]

[[test]]
name = "include-exclude"
path = "tests/include-exclude.rs"
required-features = ["include-exclude"]

[[bench]]
name = "embed_lookup"
path = "benches/embed_lookup.rs"
harness = false
required-features = ["bench-fixtures"]

[[example]]
name = "bench_size"
path = "examples/bench_size.rs"
required-features = ["bench-fixtures"]
